name: Decode binary assets

on:
  push:
    branches: [main]
    paths: ['_bin/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: decode-binaries
  cancel-in-progress: false

jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Decode _bin into site files
        id: decode
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          if [ ! -f _bin/SHA256SUMS ]; then
            echo "No _bin/SHA256SUMS yet - waiting for more uploads."
            echo "done=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for p in _bin/**/*.part00; do
            b="${p%.part00}"
            cat "$b".part[0-9][0-9] > "$b"
          done
          missing=0
          while read -r sum path; do
            [ -z "${path:-}" ] && continue
            if [ ! -f "_bin/$path.gz.b64" ] && [ ! -f "_bin/$path.b64" ]; then
              echo "Missing upload for $path"; missing=1
            fi
          done < _bin/SHA256SUMS
          if [ "$missing" = 1 ]; then
            echo "Not all files uploaded yet - waiting."
            echo "done=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          paths=()
          while read -r sum path; do
            [ -z "${path:-}" ] && continue
            mkdir -p "$(dirname "$path")"
            if [ -f "_bin/$path.gz.b64" ]; then
              tr -d ' \r\n' < "_bin/$path.gz.b64" | base64 -d | gunzip -c > "$path"
            else
              tr -d ' \r\n' < "_bin/$path.b64" | base64 -d > "$path"
            fi
            paths+=("$path")
          done < _bin/SHA256SUMS
          sha256sum -c _bin/SHA256SUMS
          git rm -r -q _bin
          git add -- "${paths[@]}"
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Commit decoded files
        if: steps.decode.outputs.done == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Decode binary assets for Pages"
          git push origin HEAD:main

      - name: Try to enable GitHub Pages (main /)
        if: steps.decode.outputs.done == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f 'source[branch]=main' -f 'source[path]=/' || true
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f cname=2dfxlab.com || true
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -F https_enforced=true || true
          gh api "repos/${GITHUB_REPOSITORY}/pages" || true
